name: Chanthaburi Rain Alert Auto-Check

on:
  schedule:
    # รันอัตโนมัติตรวจเรดาร์ทุกๆ 1 ชั่วโมง (24 ชั่วโมงฟรี)
    - cron: '0 * * * *'
  workflow_dispatch: # สร้างปุ่มให้กดทดสอบบน Cloud ได้ทันที

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Rain Alert Check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node index.js
